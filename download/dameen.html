<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ضمين — تسوّق مضمون بثقة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap');
:root{
--bg:#F6F2E9;--card:#FFFDF8;--card2:#FBF7EC;--ink:#242B22;--mut:#84806F;--line:#E8E1CF;
--grn:#1D4432;--grn2:#2A5C43;--amb:#B07E2B;--amb2:#93671F;--red:#A63A2E;--navy:#2E3A46;
--sh:0 12px 32px rgba(29,68,50,.10);--sh2:0 4px 14px rgba(29,68,50,.08);--r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.75;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 420px at 85% -60px,rgba(29,68,50,.06),transparent 60%),radial-gradient(700px 380px at 0% 0%,rgba(176,126,43,.05),transparent 55%)}
h1,h2,h3,h4,.fx{font-family:'Alexandria',sans-serif;line-height:1.55}
button{font-family:inherit}
img{display:block}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#D8CFB6;border-radius:9px}::-webkit-scrollbar-track{background:transparent}
.wrap{max-width:1180px;margin:auto;padding:18px 20px 100px;position:relative;z-index:1}

/* ===== Buttons / chips / tags ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font-family:inherit;font-weight:700;border-radius:13px;padding:10px 18px;font-size:13.5px;transition:.2s;background:var(--grn);color:#F3EFE3;box-shadow:0 4px 12px rgba(29,68,50,.18)}
.btn:hover{filter:brightness(1.13);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.amb{background:var(--amb);box-shadow:0 4px 12px rgba(176,126,43,.22)}
.btn.red{background:var(--red);box-shadow:0 4px 12px rgba(166,58,46,.2)}
.btn.ghost{background:transparent;border:1.6px solid var(--grn);color:var(--grn);box-shadow:none}
.btn.soft{background:#1D443214;color:var(--grn);box-shadow:none}
.btn.gray{background:#EFE9D8;color:#5c5849;box-shadow:none}
.btn.sm{padding:6px 13px;font-size:12px;border-radius:10px}
.btn.xs{padding:4px 10px;font-size:11px;border-radius:9px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 15px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-size:12px;font-weight:600;cursor:pointer;transition:.18s;white-space:nowrap;font-family:inherit}
.chip:hover{border-color:var(--acc,var(--grn))}
.chip.on{background:var(--acc,var(--grn));border-color:var(--acc,var(--grn));color:#fff}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.tag.grn{background:#1D443218;color:var(--grn)} .tag.amb{background:#B07E2B1f;color:var(--amb2)}
.tag.red{background:#A63A2E1c;color:var(--red)} .tag.gry{background:#84806F1c;color:var(--mut)}
.tag.nvy{background:#2E3A4620;color:var(--navy)} .tag.wht{background:#ffffff2e;color:#fff;border:1px solid #ffffff4d}
.stars{color:var(--amb);font-size:12px;letter-spacing:1.5px;white-space:nowrap}
.mut{color:var(--mut)} .sm{font-size:11.5px} .b7{font-weight:700}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hr{height:1px;background:var(--line);margin:13px 0}

/* ===== Top bar ===== */
#top{position:sticky;top:0;z-index:60;background:rgba(246,242,233,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.topin{max-width:1180px;margin:auto;display:flex;align-items:center;gap:11px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0}
.brand .lg{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--grn),var(--grn2));color:#F6F2E9;display:grid;place-items:center;font-family:Alexandria;font-weight:800;font-size:18px;box-shadow:var(--sh2)}
.brand .bt b{font-family:Alexandria;font-weight:800;font-size:18px;color:var(--grn);display:block;line-height:1.2}
.brand .bt small{display:block;font-size:9px;color:var(--mut);font-weight:600;letter-spacing:.4px}
.sbox{flex:1;max-width:470px;position:relative;margin-inline:auto;min-width:170px}
.sbox input{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:9px 44px 9px 16px;font-family:inherit;font-size:13px;outline:none;transition:.2s}
.sbox input:focus{border-color:var(--grn);box-shadow:0 0 0 4px rgba(29,68,50,.08)}
.sbox .si{position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:14px;pointer-events:none}
.nav{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nlink{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:11px;font-size:12.5px;font-weight:600;color:#4c5546;cursor:pointer;white-space:nowrap;transition:.18s;border:1.5px solid transparent;position:relative;background:none}
.nlink:hover{background:#fff;color:var(--grn)}
.nlink.on{background:var(--grn);color:#F3EFE3}
.nlink .bdg{position:absolute;top:-4px;inset-inline-end:-2px;background:var(--amb);color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:99px;display:grid;place-items:center;padding:0 3px}
.iconbtn{width:39px;height:39px;border-radius:12px;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;font-size:15px;position:relative;transition:.18s;color:#4c5546;flex-shrink:0}
.iconbtn:hover{border-color:var(--grn);color:var(--grn)}
.iconbtn .bdg{position:absolute;top:-5px;inset-inline-end:-5px;background:var(--red);color:#fff;font-size:9px;font-weight:800;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;padding:0 3px}
.avat{width:37px;height:37px;border-radius:12px;background:linear-gradient(135deg,var(--amb),var(--amb2));color:#fff;display:grid;place-items:center;font-weight:700;font-family:Alexandria;cursor:pointer;font-size:15px;flex-shrink:0}
.dd{position:relative}
.ddmenu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--sh);padding:6px;min-width:215px;z-index:90;display:none}
.dd.open .ddmenu{display:block;animation:pop .18s}
.ddmenu .it{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;font-size:12.5px;font-weight:600;cursor:pointer}
.ddmenu .it:hover{background:var(--card2)}
.ddmenu .sep{height:1px;background:var(--line);margin:5px 4px}
.ddmenu .hti{display:flex;flex-direction:column;padding:9px 11px;border-radius:10px;cursor:pointer;transition:.15s}
.ddmenu .hti:hover{background:var(--card2)}
.ddmenu .hti b{font-size:12.5px;display:flex;align-items:center;gap:8px}
.ddmenu .hti span{font-size:10px;color:var(--mut)}

/* ===== Hero + bubbles ===== */
.hero{text-align:center;margin:10px 0 2px;position:relative}
.hero h1{font-size:clamp(20px,3.2vw,29px);font-weight:800;color:var(--grn)}
.hero h1 em{color:var(--amb);font-style:normal}
.hero p{color:var(--mut);font-size:13px;margin-top:1px}
.bubzone{margin:16px 0 2px}
.bubzone .lbl{display:flex;align-items:center;gap:9px;font-size:11.5px;font-weight:700;color:var(--mut);margin-bottom:8px}
.bubzone .lbl::after{content:'';flex:1;height:1px;background:var(--line)}
.bubzone .lbl .dot{width:7px;height:7px;border-radius:50%;background:var(--amb);animation:pulse 1.6s infinite}
.bubzone .lbl .sw{margin-inline-start:auto;display:flex;gap:5px}
.bubzone .lbl .sw i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:.3s}
.bubzone .lbl .sw i.on{background:var(--amb);width:18px;border-radius:9px}
@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
.bubwrap{overflow:hidden;padding:7px 0 5px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.bubtrack{display:flex;gap:26px;width:max-content;animation:bmove 48s linear infinite}
.bubwrap:hover .bubtrack{animation-play-state:paused}
@keyframes bmove{to{transform:translateX(50%)}}
.bub{display:flex;flex-direction:column;align-items:center;gap:7px;width:94px;cursor:pointer}
.bub .ring{width:82px;height:82px;border-radius:50%;padding:3px;background:var(--c,#1D4432);transition:.25s;box-shadow:0 5px 14px rgba(0,0,0,.12)}
.bub:hover .ring{transform:scale(1.08) translateY(-2px)}
.bub .ring>div{width:100%;height:100%;border-radius:50%;overflow:hidden;border:2.5px solid #fff}
.bub img{width:100%;height:100%;object-fit:cover}
.bub b{font-size:10.5px;font-weight:600;line-height:1.35;text-align:center;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;max-width:94px}
.bub span{font-size:10.5px;font-weight:800;color:var(--grn);font-family:Alexandria}
.trust{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:14px 0 2px}
.tchip{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:11px;font-weight:600;color:#4c5546}
.tchip i{font-style:normal}

/* ===== Sections trio ===== */
.secthead{display:flex;align-items:center;gap:10px;margin:28px 0 13px}
.secthead h2{font-size:16.5px;font-weight:800;color:var(--grn)}
.secthead .ln{flex:1;height:1px;background:var(--line)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tri{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;transition:.22s;position:relative;overflow:hidden}
.tri::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--c)}
.tri:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:var(--c)}
.tri .ic{width:46px;height:46px;border-radius:14px;background:var(--c);display:grid;place-items:center;font-size:21px;flex-shrink:0;color:#fff}
.tri .tx b{display:block;font-family:Alexandria;font-size:14px;font-weight:700;line-height:1.4}
.tri .tx span{font-size:10.5px;color:var(--mut);display:block;line-height:1.5}
.tri .win{margin-inline-start:auto;flex-shrink:0;text-align:center;background:var(--c)14;border:1px dashed var(--c)88;padding:5px 10px;border-radius:11px}
.tri .win i{display:block;font-style:normal;font-size:9px;color:var(--mut);line-height:1.3}
.tri .win b{font-size:11px;color:var(--c);font-family:Alexandria;font-weight:700}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.howc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:11px;align-items:flex-start}
.howc .n{width:30px;height:30px;border-radius:10px;background:var(--grn);color:#fff;display:grid;place-items:center;font-family:Alexandria;font-weight:800;font-size:14px;flex-shrink:0}
.howc b{font-size:12.5px;display:block;font-family:Alexandria}
.howc span{font-size:11px;color:var(--mut);line-height:1.6;display:block}

/* ===== Product cards ===== */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(183px,1fr));gap:13px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.22s;position:relative;display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.pcard .ph{aspect-ratio:1/.9;overflow:hidden;position:relative;background:#EFE9DA}
.pcard .ph img{width:100%;height:100%;object-fit:cover;transition:.45s}
.pcard:hover .ph img{transform:scale(1.07)}
.offb{position:absolute;top:9px;inset-inline-start:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;padding:2.5px 9px;border-radius:99px;z-index:2}
.secb{position:absolute;bottom:9px;inset-inline-start:9px;background:rgba(255,255,255,.94);color:var(--c);font-size:9.5px;font-weight:800;padding:2.5px 9px;border-radius:99px;z-index:2}
.favh{position:absolute;top:8px;inset-inline-end:8px;width:31px;height:31px;border-radius:50%;background:rgba(255,255,255,.95);border:0;display:grid;place-items:center;cursor:pointer;font-size:13.5px;z-index:3;transition:.18s;box-shadow:0 2px 8px rgba(0,0,0,.1);color:#a39f8f}
.favh:hover{transform:scale(1.14)}
.favh.on{color:var(--red)}
.pcard .pb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.pcard .nm{font-size:12.5px;font-weight:700;line-height:1.45;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pcard .st{font-size:10.5px;color:var(--mut);display:flex;gap:6px;align-items:center}
.pcard .pr{display:flex;align-items:baseline;gap:7px;margin-top:auto;padding-top:4px}
.pcard .pr b{font-family:Alexandria;font-size:14px;color:var(--grn)}
.pcard .pr s{font-size:10.5px;color:var(--mut)}

/* ===== Section & store pages ===== */
.sechero{border-radius:20px;padding:20px 22px;color:#fff;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:var(--sh);background:linear-gradient(140deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#181614))}
.sechero .ic{width:58px;height:58px;border-radius:18px;background:#ffffff26;backdrop-filter:blur(6px);display:grid;place-items:center;font-size:27px;border:1px solid #ffffff42}
.sechero h1{font-size:20px;font-weight:800}
.sechero p{font-size:12px;opacity:.92}
.winb{display:inline-flex;align-items:center;gap:7px;background:#ffffff1f;border:1px dashed #ffffff59;padding:6px 13px;border-radius:99px;font-size:11.5px;font-weight:700;margin-inline-start:auto}
.ministores{display:flex;gap:10px;overflow-x:auto;padding:3px 0 7px;scrollbar-width:none}
.ministores::-webkit-scrollbar{display:none}
.mstore{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px 8px 16px;cursor:pointer;transition:.2s;flex-shrink:0;position:relative;overflow:hidden}
.mstore::after{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:3.5px;background:var(--c)}
.mstore:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--c)}
.mstore .lg{width:38px;height:38px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:Alexandria;font-weight:800;font-size:15px;flex-shrink:0}
.mstore b{font-size:12px;font-family:Alexandria;font-weight:700;display:block;white-space:nowrap;line-height:1.4}
.mstore .mr{font-size:10px;color:var(--mut);display:flex;gap:7px;align-items:center;white-space:nowrap}
.storeban{border-radius:20px;padding:22px 24px;color:#fff;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:var(--sh);background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 52%,#171412));position:relative;overflow:hidden}
.storeban .lg{width:64px;height:64px;border-radius:19px;background:#ffffff24;border:1px solid #ffffff40;display:grid;place-items:center;font-family:Alexandria;font-weight:800;font-size:26px}
.storeban h1{font-size:20px}
.pghead{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.pghead h1{font-size:19px;flex:1}
.backb{width:37px;height:37px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:15px;color:#4c5546;transition:.18s;flex-shrink:0}
.backb:hover{border-color:var(--grn);color:var(--grn)}

/* ===== Product page ===== */
.ppage{display:grid;grid-template-columns:1.02fr 1fr;gap:22px;align-items:start}
.pgal .main{border-radius:20px;overflow:hidden;aspect-ratio:1/.85;border:1px solid var(--line);background:#EFE9DA;position:relative}
.pgal .main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.thumbs img{width:60px;height:60px;border-radius:12px;object-fit:cover;border:2px solid transparent;cursor:pointer;transition:.18s}
.thumbs img.on,.thumbs img:hover{border-color:var(--amb)}
.gstrip{display:flex;gap:11px;background:linear-gradient(135deg,var(--grn),var(--grn2));color:#F3EFE3;border-radius:15px;padding:12px 15px;margin-top:13px;font-size:11.5px;align-items:center;line-height:1.7}
.gstrip .gi{font-size:22px;flex-shrink:0}
.specrow{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px dashed #EAE3D0;font-size:13px}
.specrow span{color:var(--mut)}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);margin:24px 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:9px 16px;font-size:12.5px;font-weight:700;color:var(--mut);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;font-family:inherit;white-space:nowrap}
.tabs button.on{color:var(--grn);border-color:var(--grn)}
.rev{border-bottom:1px dashed #EAE3D0;padding:11px 2px}
.rev:last-child{border:0}
.rev .rh{display:flex;align-items:center;gap:9px;margin-bottom:3px}
.rev .rh .av{width:30px;height:30px;border-radius:9px;background:var(--card2);display:grid;place-items:center;font-size:13px}
.rev .rh b{font-size:12.5px}
.rev p{font-size:12.5px;color:#4c5546;line-height:1.7}
.qty{display:flex;align-items:center;gap:2px;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}
.qty button{width:30px;height:30px;border:0;background:transparent;font-size:16px;font-weight:800;cursor:pointer;color:var(--grn);transition:.15s}
.qty button:hover{background:var(--card2)}
.qty b{min-width:28px;text-align:center;font-size:13px}
.starin{display:flex;gap:7px;font-size:29px;cursor:pointer;justify-content:center;padding:4px 0}
.starin span{color:#D8CDB0;transition:.15s;user-select:none}
.starin span.on{color:var(--amb);text-shadow:0 2px 8px #b07e2b33}

/* ===== Cart & checkout ===== */
.cartgrid{display:grid;grid-template-columns:1fr 335px;gap:16px;align-items:start}
.cgroup{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px}
.cghead{display:flex;align-items:center;gap:10px;padding:11px 15px;background:var(--card2);border-bottom:1px solid var(--line);font-size:12.5px;flex-wrap:wrap}
.cghead .lg{width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:13px;font-family:Alexandria;font-weight:800}
.citem{display:flex;gap:12px;padding:13px 15px;border-bottom:1px solid #F0EADB;cursor:pointer;transition:.15s;align-items:center}
.citem:hover{background:#FBF7EC}
.citem:last-child{border-bottom:0}
.citem .im{width:74px;height:74px;border-radius:13px;overflow:hidden;flex-shrink:0;border:1px solid var(--line)}
.citem .im img{width:100%;height:100%;object-fit:cover}
.citem .info{flex:1;min-width:0}
.sumbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;position:sticky;top:76px}
.srow{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:4.5px 0;color:#4c5546;gap:10px}
.srow b{font-family:Alexandria}
.srow.tot{border-top:1.5px dashed var(--line);margin-top:9px;padding-top:11px;font-size:15px;font-weight:800;color:var(--ink);font-family:Alexandria}
.srow.disc{color:var(--grn)}
.cksteps{display:flex;align-items:center;gap:6px;margin-bottom:16px}
.ckstep{flex:1;text-align:center;font-size:10.5px;font-weight:700;color:var(--mut)}
.ckstep .b{height:5px;border-radius:9px;background:#E5DEC9;margin-bottom:5px}
.ckstep.on{color:var(--grn)} .ckstep.on .b{background:var(--grn)}
.ckstep.done{color:var(--amb2)} .ckstep.done .b{background:var(--amb)}

function switchRole(r){
if(r==='customer'){SES.role='customer';go('home');return}
if(r==='merchant'){const own=STORES.find(s=>s.owner===SES.phone);
if(own){SES.role='merchant';SES.store=own.id;go('m-dash')}
else if(me().role==='admin'){SES.role='merchant';SES.store='s1';go('m-dash')}
else{toast('لا يوجد متجر مرتبط بحسابك — استخدم حساب التاجر التجريبي','amb');openAuth('merchant')}
return}
if(r==='admin'){if(me().role==='admin'){SES.role='admin';go('a-over')}else{toast('الإدارة تدخل بحساب المشرف العام فقط','err');openAuth('admin')}}

function doLogin(){

SES={phone:ph,role:u.role,store:u.store||null};
closeModal();toast('أهلاً بك '+esc(u.name)+' 👋','ok');

}
function doRegister(){
const nm=($('#rg-nm').value||'').trim(),ph=($('#rg-ph').value||'').trim(),pw=($('#rg-pw').value||'').trim();

if(USERS[ph]){toast('هذا الرقم مسجل مسبقاً — سجّل دخولك','amb');authTab('login');return}
USERS[ph]={name:nm,role:'customer',pass:pw,pts:50,bal:0,since:Date.now(),ptsLog:[{t:'هدية الترحيب بضمين',v:50,at:Date.now()}],favs:[...GFav],addrs:[],notif:{ord:true,off:true,dis:true,rev:true},hidePhone:false};
GFav=[];
SES={phone:ph,role:'customer'};
closeModal();toast('تم إنشاء حسابك وأُضيفت ٥٠ نقطة ترحيبية 🎉','ok');render();
}
function quickLogin(r){
const map={customer:'0500000001',merchant:'0500000002',admin:'0500000003'};
const u=USERS[map[r]];SES={phone:map[r],role:u.role,store:u.store||null};
closeModal();toast('دخلت كـ'+esc(u.name)+' ('+({customer:'عميل',merchant:'تاجر',admin:'إدارة'}[r])+')','ok');
if(r==='merchant')go('m-dash');else if(r==='admin')go('a-over');else render();

function pgSearch(){
const q=(VIEW.q||'').trim();
const ql=q.replace(/[أإآ]/g,'ا');
const hit=s=>s.replace(/[أإآ]/g,'ا').includes(ql);

return `<div class="pghead"><button class="backb" onclick="go('home')">→</button><h1>نتائج البحث عن «${esc(q)}»</h1><span class="tag gry">${ar(ps.length+ss.length)} نتيجة</span></div>

function cartCalc(){
const items=CART.map(c=>({...c,p:P(c.pid)})).filter(c=>c.p);
const groups={};items.forEach(c=>{(groups[c.p.store]=groups[c.p.store]||[]).push(c)});
const sub=r2(items.reduce((a,c)=>a+eff(c.p)*c.qty,0));
const dl=r2(Object.values(groups).reduce((a,g)=>a+(g.reduce((x,c)=>x+eff(c.p)*c.qty,0)>=200?0:12),0));
let cpn=0;if(CPN&&DB.coupons[CPN]){const c=DB.coupons[CPN];cpn=r2(Math.min(c.type==='pct'?sub*c.v/100:c.v,c.max))}
const ptsMax=SES?Math.floor(Math.min((me().pts||0))/100)*100:0;
let ptsUse=Math.min(PTS,Math.floor(Math.max(sub-cpn,0)/10)*100,ptsMax);ptsUse=Math.max(0,Math.floor(ptsUse/100)*100);
const ptsAmt=r2(ptsUse/10);
const total=r2(Math.max(0,sub+dl-cpn-ptsAmt));
return{items,groups,sub,dl,cpn,ptsMax,ptsUse,ptsAmt,total};
}

const s=myStore(),sec=SEC(s.sec);

return `<div class="ocard" style="border-inline-start:4px solid ${d.status==='open'?'var(--red)':'var(--grn)'}">
<div class="spread" style="flex-wrap:wrap">
<div><b class="fx" style="font-size:13px">⚖️ ${esc(d.subject)}</b><div class="hint">طلب #${ar(d.order)} · ${USERS[d.customer]?esc(USERS[d.customer].name.split(' ')[0]):'عميل'} · ${ago(d.openedAt)}</div></div>
${d.status==='open'?'<span class="tag red">بانتظار حكم الإدارة — المبلغ معلق</span>':`<span class="tag ${d.ruling.act==='release'?'grn':'gry'}">${d.ruling.act==='release'?'حُكم لصالحك':'استُرجع للعميل'}</span>`}</div>
${d.ruling?`<div class="verd ${d.ruling.act==='release'?'rel':'ref'}" style="margin:9px 0 2px"><h4>تسبيب الحكم</h4><div class="why">${esc(d.ruling.text)}</div></div>`:''}
<button class="btn sm ${d.status==='open'?'red':''} mt" onclick="openDispute('${d.id}')">💬 ${d.status==='open'?'الرد على العميل وإضافة أدلتك':'عرض المحادثة'}</button>
</div>`}).join(''):'<div class="empty"><div class="em">🕊️</div><b>لا نزاعات على متجرك</b><span>استمر في الجودة والسرعة 🌟</span></div>'}`;
}
function pgMSet(){
const s=myStore(),sec=SEC(s.sec);
return `<div class="pghead"><h1>⚙️ إعدادات المتجر</h1><span class="tag" style="background:${s.color}18;color:${s.color}">${sec.name}</span></div>
<div class="grid2">
<div class="acard"><h3>🏪 بيانات المتجر</h3>
<div class="fld"><label>اسم المتجر</label><input class="inp" id="ms-nm" value="${esc(s.name)}"></div>
<div class="fld mt"><label>وصف المتجر (يظهر لكل العملاء)</label><textarea class="inp" id="ms-ds" style="min-height:80px">${esc(s.desc)}</textarea></div>
<button class="btn mt" onclick="mSaveStore()">حفظ البيانات</button>
</div>
<div class="acard"><h3>🚦 حالة التشغيل</h3>
<div class="setrow"><div class="ic">${s.open?'🟢':'🔴'}</div><div class="tx"><b>استقبال الطلبات</b><span>${s.open?'متجرك مفتوح ويستقبل الطلبات':'مغلق مؤقتاً — منتجاتك تظهر دون زر شراء'}</span></div>
<button class="sw ${s.open?'on':''}" onclick="myStore().open=!myStore().open;render()"></button></div>
<div class="setrow"><div class="ic">🛡️</div><div class="tx"><b>نافذة حماية قسمك</b><span>${sec.name}: ${sec.win} بعد استلام العميل — ثابتة بسياسة ضمين</span></div><span class="tag grn">إلزامية</span></div>
<div class="setrow"><div class="ic">🧾</div><div class="tx"><b>عمولة ضمين</b><span>٢٫٥٪ من كل شحنة — تُقتطع لحظة التحرير فقط</span></div><span class="tag amb">٢٫٥٪</span></div>
</div>
</div>`;
}
function mSaveStore(){const s=myStore();
const nm=($('#ms-nm').value||'').trim();
if(nm.length<2){toast('اسم المتجر قصير','err');return}
s.name=nm;s.desc=($('#ms-ds').value||'').trim();
toast('حُفظت بيانات متجرك ✓','ok');render()}
/* ================= صفحات الإدارة ================= */
const vaultNow=()=>r2(DB.orders.reduce((a,o)=>a+o.groups.filter(g=>['pending','preparing','shipped','received','disputed'].includes(g.status)).reduce((x,g)=>x+g.sub+g.dl,0),0));
function pgAOver(){
const open=DB.disputes.filter(d=>d.status==='open');
const releasedTotal=DB.orders.reduce((a,o)=>a+o.groups.reduce((x,g)=>x+(g.payout?g.payout.sub:0),0),0);
return `<div class="pghead"><h1>🛡️ مركز إدارة ضمين</h1><span class="tag nvy">المشرف العام</span></div>
<div class="kpis">
<div class="kpi grn"><i>🧾</i><b>${money(DB.aRevenue)}</b><span>إجمالي عمولات ضمين (٢٫٥٪)</span></div>
<div class="kpi amb"><i>🔒</i><b>${money(vaultNow())}</b><span>مبالغ محجوزة حالياً</span></div>
<div class="kpi nvy"><i>🔓</i><b>${money(releasedTotal)}</b><span>إجمالي الشحنات المحررة</span></div>
<div class="kpi red"><i>⚖️</i><b>${ar(open.length)}</b><span>نزاعات بانتظار حكمك</span></div>
<div class="kpi"><i>🏪</i><b>${ar(STORES.length)}</b><span>متجر (${ar(STORES.filter(s=>!s.approved).length)} معلق)</span></div>
<div class="kpi"><i>👥</i><b>${ar(Object.keys(USERS).length)}</b><span>مستخدم مسجل</span></div>
</div>
<div class="grid2 mt">
<div class="acard"><h3>⚖️ طابور التحكيم</h3>
${open.length?open.map(d=>`<div class="row" style="cursor:pointer" onclick="openDispute('${d.id}')">
<div style="flex:1"><b>${esc(d.subject)}</b><div class="hint">${ST(d.store).name} · طلب #${ar(d.order)} · ${ago(d.openedAt)}</div></div>
<span class="tag red">يحتاج حكماً</span></div>`).join(''):'<div class="hint mb">لا نزاعات معلقة — كل شيء تحت السيطرة 🕊️</div>'}
<button class="btn soft wide" onclick="go('a-disputes')">كل النزاعات ←</button></div>
<div class="acard"><h3>🚦 متاجر بانتظار الاعتماد</h3>
${STORES.filter(s=>!s.approved).map(s=>`<div class="row">
<div class="mstore" style="--c:${s.color};pointer-events:none"><div class="lg">${s.name[0]}</div><div><b>${esc(s.name)}</b><span class="mr">${SEC(s.sec).name} · ${USERS[s.owner]?esc(USERS[s.owner].name):''}</span></div></div>
<button class="btn sm" onclick="aApprove('${s.id}')">✓ اعتماد</button></div>`).join('')||'<div class="hint">لا متاجر معلقة</div>'}
</div></div>`;
}
function pgADisputes(){
const open=DB.disputes.filter(d=>d.status==='open');
const done=DB.disputes.filter(d=>d.status==='resolved');
return `<div class="pghead"><h1>⚖️ التحكيم</h1><span class="tag ${open.length?'red':'grn'}">${ar(open.length)} مفتوح · ${ar(done.length)} محسوم</span></div>
<b class="fx" style="font-size:14px;color:var(--red)">⏳ بانتظار الحكم — افتح الدردشة واطّلع على أدلة الطرفين</b>
${open.map(d=>{const o=DB.orders.find(x=>x.id===d.order);const g=o.groups.find(x=>x.store===d.store);
return `<div class="ocard" style="border-inline-start:4px solid var(--red)">
<div class="spread" style="flex-wrap:wrap">
<div><b class="fx" style="font-size:13.5px">${esc(d.subject)}</b>
<div class="hint">${USERS[d.customer]?esc(USERS[d.customer].name):'عميل'} × ${ST(d.store).name} · طلب #${ar(d.order)} · ${money(g.sub)} معلقة</div></div>
<span class="tag red">مبلغ معلق ${money(g.sub)}</span></div>
<button class="btn red sm mt" onclick="openDispute('${d.id}')">🛡️ فتح القضية وإصدار الحكم</button></div>`}).join('')||'<div class="empty" style="padding:26px"><div class="em">🕊️</div><b>لا قضايا مفتوحة</b></div>'}
<div class="hr" style="margin:20px 0"></div>
<b class="fx" style="font-size:14px;color:var(--grn)">📁 أحكام صادرة</b>
${done.map(d=>`<div class="ocard" style="border-inline-start:4px solid var(--grn)">
<div class="spread" style="flex-wrap:wrap">
<div><b class="fx" style="font-size:13px">${esc(d.subject)} — طلب #${ar(d.order)}</b>
<div class="hint">${d.ruling.act==='release'?'إفراج للتاجر':'استرجاع للعميل'} · ${dt(d.ruling.at)}</div></div>
<button class="btn gray xs" onclick="openDispute('${d.id}')">عرض الملف</button></div>
<div class="verd ${d.ruling.act==='release'?'rel':'ref'}" style="margin:8px 0 0"><h4>التسبيب</h4><div class="why">${esc(d.ruling.text)}</div></div></div>`).join('')||'<div class="hint mt">لا أحكام سابقة</div>'}`;
}
function pgAStores(){
return `<div class="pghead"><h1>🏪 إدارة المتاجر</h1></div>
<div class="acard"><div class="rows">
${STORES.map(s=>`<div class="row">
<div style="width:44px;height:44px;border-radius:13px;background:${s.color};color:#fff;display:grid;place-items:center;font-family:Alexandria;font-weight:800;flex-shrink:0">${s.name[0]}</div>
<div style="flex:1;min-width:0"><b>${esc(s.name)}</b>
<div class="hint">${SEC(s.sec).name} · ${USERS[s.owner]?esc(USERS[s.owner].name):'—'} · ★ ${ard(s.rt)} · ${ar(s.sales)} عملية</div></div>
<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
<span class="fx" style="font-size:12.5px;color:var(--grn)">${money(DB.storeWallets[s.id]||0)}</span>
${!s.approved?`<span class="tag amb">معلق</span><button class="btn sm" onclick="aApprove('${s.id}')">✓ اعتماد</button>`
:s.susp?`<span class="tag red">موقوف</span><button class="btn gray xs" onclick="aSusp('${s.id}')">إلغاء الإيقاف</button>`
:`<span class="tag grn">معتمد</span><button class="btn red xs" onclick="aSusp('${s.id}')">إيقاف</button>`}
</div></div>`).join('')}
</div></div>`;
}
function aApprove(sid){const s=ST(sid);s.approved=true;
pushNotif(s.owner,'🎉','تهانينا! اعتُمد متجرك','«'+s.name+'» صار ظاهراً للعملاء في قسم '+SEC(s.sec).name,['m-dash']);
toast('اعتُمد متجر «'+s.name+'» ✓','ok');render()}
function aSusp(sid){const s=ST(sid);s.susp=!s.susp;
pushNotif(s.owner,s.susp?'⛔':'✅',s.susp?'أُوقف متجرك مؤقتاً':'أُلغي إيقاف متجرك',s.susp?'راجع فريق الامتثال في ضمين':'عاد متجرك للعمل بشكل طبيعي',['m-set']);
toast(s.susp?'أُوقف المتجر مؤقتاً':'أُعيد تشغيل المتجر','ok');render()}
function pgAUsers(){
return `<div class="pghead"><h1>👥 المستخدمون (${ar(Object.keys(USERS).length)})</h1></div>
<div class="acard"><div class="rows">
${Object.entries(USERS).map(([ph,u])=>`<div class="row">
<div class="avat" style="width:38px;height:38px;border-radius:12px;font-size:14px">${u.name[0]}</div>
<div style="flex:1;min-width:0"><b>${esc(u.name)}</b><div class="hint">${ar(ph)}${u.store?' · '+ST(u.store).name:''}</div></div>
<span class="tag ${u.role==='customer'?'grn':u.role==='merchant'?'amb':'nvy'}">${{customer:'عميل',merchant:'تاجر',admin:'إدارة'}[u.role]}</span>
${u.role==='customer'?`<span class="hint">🌟 ${ar(u.pts||0)}</span><span class="hint">💰 ${money(u.bal||0)}</span>`:''}
<span class="hint">${ar(DB.orders.filter(o=>o.customer===ph).length)} طلب</span>
</div>`).join('')}
</div></div>`;
}
function pgARev(){
const mx=Math.max(...DB.revMonths.map(m=>m.v));
return `<div class="pghead"><h1>📈 إيرادات ضمين</h1><span class="tag grn">عمولة ٢٫٥٪ تُحوَّل للإدارة لحظة كل تحرير</span></div>
<div class="kpis mb">
<div class="kpi grn"><i>🧾</i><b>${money(DB.aRevenue)}</b><span>إجمالي العمولات حتى اليوم</span></div>
<div class="kpi amb"><i>🔒</i><b>${money(vaultNow())}</b><span>محجوز في الخزنة الآن</span></div>
<div class="kpi nvy"><i>🏪</i><b>${money(r2(Object.values(DB.storeWallets).reduce((a,b)=>a+b,0)))}</b><span>صافي أرصدة التجار</span></div>
</div>
<div class="acard"><h3>عمولات آخر ٥ أشهر (ألف ر.س)</h3>
<div class="rvbars">${DB.revMonths.map(m=>`<div class="rv"><span>${ard(m.v)}</span><i style="height:${Math.max(8,m.v/mx*100)}%"></i><b>${m.m}</b></div>`).join('')}</div>
</div>
<div class="acard mt"><h3>أرصدة تجار الضمان</h3>
<div class="rows">${STORES.map(s=>`<div class="row">
<div style="width:34px;height:34px;border-radius:10px;background:${s.color};color:#fff;display:grid;place-items:center;font-size:13px;font-family:Alexandria;font-weight:800">${s.name[0]}</div>
<div style="flex:1"><b>${esc(s.name)}</b><div class="hint">${SEC(s.sec).name} · محجوز لصالحه ${money(heldFor(s.id))}</div></div>
<b class="fx" style="color:var(--grn)">${money(DB.storeWallets[s.id]||0)}</b></div>`).join('')}</div></div>`;
}
/* ================= الإقلاع ================= */
document.addEventListener('click',()=>document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open')));
render();

</script>
</body>
</html>
